```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Company Sign Up | Campus2Career</title>

    <link
        rel="stylesheet"
        href="company-signup.css"
    >

</head>


<body>

    <div class="page-wrapper">

        <div class="signup-card">

            <!-- ======================================
                 CAMPUS2CAREER LOGO
            ======================================= -->

            <div class="logo-container">

                <a href="index.html">

                    <img
                        src="logo.png"
                        alt="Campus2Career Logo"
                        class="campus-logo"
                    >

                </a>

            </div>


            <!-- ======================================
                 BRAND HEADER
            ======================================= -->

            <div class="brand">

                <h1>
                    Company Registration
                </h1>

                <p>
                    Join Campus2Career as a company
                </p>

            </div>


            <!-- ======================================
                 FORM
            ======================================= -->

            <div class="form-container">

                <h2>
                    Create Company Account
                </h2>

                <p class="subtitle">
                    Register your company to access
                    the recruiter portal.
                </p>


                <form id="companySignupForm">


                    <!-- COMPANY NAME -->

                    <div class="form-group">

                        <label for="companyName">
                            Company Name
                        </label>

                        <input
                            type="text"
                            id="companyName"
                            name="companyName"
                            placeholder="Enter company name"
                            maxlength="150"
                            autocomplete="organization"
                            required
                        >

                        <small
                            id="companyNameError"
                            class="error-message"
                        ></small>

                    </div>


                    <!-- GMAIL -->

                    <div class="form-group">

                        <label for="gmail">
                            Gmail ID
                        </label>

                        <input
                            type="email"
                            id="gmail"
                            name="gmail"
                            placeholder="company@gmail.com"
                            maxlength="255"
                            autocomplete="email"
                            required
                        >

                        <small
                            id="gmailError"
                            class="error-message"
                        ></small>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                            >
                                Show
                            </button>

                        </div>

                        <small class="password-hint">
                            Minimum 8 characters
                        </small>

                        <small
                            id="passwordError"
                            class="error-message"
                        ></small>

                    </div>


                    <!-- MESSAGE -->

                    <div
                        id="signupMessage"
                        class="signup-message"
                        style="display: none;"
                    ></div>


                    <!-- SIGNUP BUTTON -->

                    <button
                        type="submit"
                        id="signupBtn"
                        class="signup-btn"
                    >
                        Create Company Account
                    </button>


                </form>


                <!-- ======================================
                     SIGN IN LINK
                ======================================= -->

                <div class="signin-section">

                    <span>
                        Already have a company account?
                    </span>

                    <a href="company-signin.html">
                        Sign In
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="company-signup.js"></script>

</body>

</html>
```
